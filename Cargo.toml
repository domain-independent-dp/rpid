[package]
name = "rpid"
version = "0.4.0"
edition = "2024"
rust-version = "1.90"
description = "Rust Programmable Interface for Domain-Independent Dynamic Programming (RPID)"
license = "MIT OR Apache-2.0"
authors = [
    "Ryo Kuroiwa <kuroiwa@nii.ac.jp>",
    "Yuxiao (Jasper) Chen <yuxiao.chen@mail.utoronto.ca>",
]
repository = "https://github.com/domain-independent-dp/rpid"

[dependencies]
rustc-hash = "2.1"
smallvec = "1.16"
num-traits = "0.2"
itertools = "0.15"
ordered-float = "5.5"
bus = "2.4"
dashmap = "6.1"
rayon = "1.10"

[dev-dependencies]
fixedbitset = "0.5"
approx = "0.5"
